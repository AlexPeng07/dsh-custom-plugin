# dsh-custom-plugin bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add github:AlexPeng07/dsh-custom-plugin`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (state store, /api/custom-plugin routes, the
# custom_plugin_status agent tool), and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/@alexpeng/dsh-custom-plugin/client.js) load in the web GUI.
- insert:
    - id: custom-plugin
      name: '@alexpeng/dsh-custom-plugin'
